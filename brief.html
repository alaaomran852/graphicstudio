<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphicStudio — البريف</title>
  <meta name="description" content="نموذج بريف احترافي يفتح واتساب برسالة جاهزة." />
  <meta name="theme-color" content="#0b0c10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0c10; --panel:#11131a; --panel2:#0f1117;
      --text:#e8eaf2; --muted:#a7adbd; --accent:#1f4fd8;
      --line:rgba(255,255,255,.09); --shadow:0 16px 40px rgba(0,0,0,.45);
      --r:18px; --r2:22px; --max:900px;
    }
    body.light{
      --bg:#f7f8fc; --panel:#fff; --panel2:#f1f3f9;
      --text:#121629; --muted:#5c647a; --line:rgba(0,0,0,.10);
      --shadow:0 18px 46px rgba(18,22,41,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:"Cairo",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 900px at 85% -10%, rgba(31,79,216,.30), transparent 55%),
        radial-gradient(900px 700px at 10% 10%, rgba(154,205,191,.16), transparent 60%),
        var(--bg);
      color:var(--text); line-height:1.6;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .container{max-width:var(--max); margin:0 auto; padding:0 18px}

    .nav{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:rgba(10,11,16,.70);backdrop-filter:blur(10px)}
    body.light .nav{background:rgba(255,255,255,.75)}
    .navInner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0}
    .brand{display:flex;align-items:center;gap:10px}
    .brandMark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(31,79,216,1),rgba(31,79,216,.55));box-shadow:var(--shadow);font-weight:900;color:#fff}
    .brandText{display:flex;flex-direction:column;gap:2px;line-height:1.1}
    .brandText strong{font-size:15px}
    .brandText span{font-size:12px;color:var(--muted)}
    .navActions{display:flex;align-items:center;gap:10px}
    .iconBtn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer}
    body.light .iconBtn{background:rgba(0,0,0,.04)}
    .cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid rgba(31,79,216,.30);background:rgba(31,79,216,.14);white-space:nowrap}
    .cta:hover{background:rgba(31,79,216,.20)}

    .pageHero{padding:34px 0 10px}
    .heroCard{
      border:1px solid var(--line);
      border-radius: calc(var(--r2) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      box-shadow: var(--shadow);
      padding: 22px;
    }
    body.light .heroCard{background: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.01))}
    .heroCard h1{margin:0 0 6px;font-size:26px}
    .heroCard p{margin:0;color:var(--muted)}

    .form{
      margin:14px 0 26px;
      border:1px solid var(--line);
      border-radius: calc(var(--r2) + 6px);
      background: rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      padding: 18px;
    }
    .row{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    label{color:var(--muted);font-size:13px}
    input,select,textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
    }
    body.light input, body.light select, body.light textarea{background: rgba(0,0,0,.03)}
    .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

    .btn{
      width:100%;
      display:inline-flex;align-items:center;justify-content:center;
      gap:10px;padding:12px 16px;border-radius:14px;
      border:1px solid rgba(31,79,216,.35);
      background: linear-gradient(135deg, rgba(31,79,216,1), rgba(31,79,216,.72));
      color:#fff; cursor:pointer;
    }

    .note{
      margin-top:10px;
      padding:12px;
      border-radius:18px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--muted);
      font-size:13px;
    }

    footer{padding:22px 0;border-top:1px solid var(--line);color:var(--muted)}
    .footerInner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

    .waFloat{
      position:fixed; right:16px; bottom:16px; z-index:60;
      padding:12px 14px; border-radius:999px;
      background:rgba(31,79,216,.95); color:#fff;
      border:1px solid rgba(31,79,216,.40); box-shadow:var(--shadow);
      display:inline-flex; align-items:center; gap:10px;
    }

    @media (max-width: 760px){ .two{grid-template-columns:1fr} }
    a:focus,button:focus{outline:3px solid rgba(31,79,216,.45);outline-offset:2px;border-radius:14px}
  </style>
</head>

<body>
  <header class="nav">
    <div class="container">
      <div class="navInner">
        <a class="brand" href="index.html">
          <span class="brandMark">GS</span>
          <span class="brandText">
            <strong>GraphicStudio</strong>
            <span>Client Brief</span>
          </span>
        </a>

        <div class="navActions">
          <button class="iconBtn" id="themeToggle" type="button">🌙</button>
          <button class="iconBtn" id="langToggle" type="button">AR</button>
          <a class="cta" id="waTop" href="#" target="_blank" rel="noopener">واتساب</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="pageHero">
      <div class="heroCard">
        <h1>أرسل البريف</h1>
        <p>املأ البيانات — سيتم فتح واتساب برسالة جاهزة ومنظمة.</p>
      </div>
    </section>

    <form class="form" id="briefForm">
      <div class="row">
        <label>الاسم</label>
        <input name="name" required placeholder="اكتب اسمك" />
      </div>

      <div class="two">
        <div class="row">
          <label>البريد الإلكتروني</label>
          <input type="email" name="email" required placeholder="example@email.com" />
        </div>
        <div class="row">
          <label>مجال المشروع</label>
          <input name="industry" required placeholder="شركة تقنية / متجر / عيادة..." />
        </div>
      </div>

      <div class="two">
        <div class="row">
          <label>الخدمة المطلوبة</label>
          <select name="service" required>
            <option value="">اختر</option>
            <option>هوية بصرية</option>
            <option>إنفوجرافيك</option>
            <option>سوشيال ميديا</option>
            <option>Packaging</option>
            <option>Company Profile</option>
          </select>
        </div>
        <div class="row">
          <label>الهدف الأساسي</label>
          <input name="goal" required placeholder="إطلاق براند / زيادة مبيعات / توحيد الهوية..." />
        </div>
      </div>

      <div class="row">
        <label>تفاصيل/ملاحظات</label>
        <textarea name="notes" rows="6" required placeholder="اكتب المطلوب بالتفصيل + أي أمثلة تحبها"></textarea>
      </div>

      <div class="two">
        <div class="row">
          <label>الميزانية (اختياري)</label>
          <input name="budget" placeholder="مثال: 3000 - 6000" />
        </div>
        <div class="row">
          <label>المدة (اختياري)</label>
          <input name="timeline" placeholder="مثال: 3 أيام / أسبوع" />
        </div>
      </div>

      <button class="btn" type="submit">إرسال على واتساب</button>

      <div class="note">
        ملاحظة: أرفق الروابط/الصور المرجعية داخل رسالة واتساب بعد فتحها (أمثلة، ألوان، منافسين، إلخ).
      </div>
    </form>
  </main>

  <footer>
    <div class="container">
      <div class="footerInner">
        <div>© <span id="year"></span> Alaa Omran — GraphicStudio</div>
        <div>Ready for GitHub Pages</div>
      </div>
    </div>
  </footer>

  <a class="waFloat" id="waFloat" href="#" target="_blank" rel="noopener">WhatsApp</a>

  <script>
    (function(){
      const PHONE = "201064255553";
      const yearEl = document.getElementById("year");
      if(yearEl) yearEl.textContent = new Date().getFullYear();

      function waLink(text){ return `https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`; }

      const waTop = document.getElementById("waTop");
      const waFloat = document.getElementById("waFloat");
      const msg = "مرحبًا، أريد إرسال بريف مشروع تصميم.";
      if(waTop) waTop.href = waLink(msg);
      if(waFloat) waFloat.href = waLink(msg);

      // Theme
      const themeBtn = document.getElementById("themeToggle");
      const savedTheme = localStorage.getItem("gs_theme");
      if(savedTheme === "light") document.body.classList.add("light");
      if(themeBtn){
        themeBtn.addEventListener("click", ()=> {
          const isLight = document.body.classList.toggle("light");
          localStorage.setItem("gs_theme", isLight ? "light" : "dark");
        });
      }

      // Lang (direction only)
      const langBtn = document.getElementById("langToggle");
      const savedLang = localStorage.getItem("gs_lang") || "ar";
      document.documentElement.lang = savedLang;
      document.documentElement.dir  = savedLang === "ar" ? "rtl" : "ltr";
      if(langBtn) langBtn.textContent = savedLang.toUpperCase();
      if(langBtn){
        langBtn.addEventListener("click", ()=> {
          const cur = localStorage.getItem("gs_lang") || "ar";
          const next = cur === "ar" ? "en" : "ar";
          localStorage.setItem("gs_lang", next);
          document.documentElement.lang = next;
          document.documentElement.dir  = next === "ar" ? "rtl" : "ltr";
          langBtn.textContent = next.toUpperCase();
        });
      }

      // Form → WhatsApp message
      const form = document.getElementById("briefForm");
      form.addEventListener("submit", (e)=>{
        e.preventDefault();
        const fd = new FormData(form);
        const data = Object.fromEntries(fd.entries());

        const text =
`مرحبًا، هذا بريف مشروع:

- الاسم: ${data.name}
- الإيميل: ${data.email}
- المجال: ${data.industry}
- الخدمة: ${data.service}
- الهدف: ${data.goal}
- الميزانية: ${data.budget || "غير محدد"}
- المدة: ${data.timeline || "غير محدد"}

- التفاصيل:
${data.notes}

أريد عرض سعر وخطة تنفيذ.`;

        window.open(waLink(text), "_blank");
      });
    })();
  </script>
</body>
</html>
