<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرسل البريف | GS STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav><a href="index.html" class="logo">GS STUDIO</a></nav>
        <div class="form-box">
            <h2 style="text-align: center; margin-bottom: 30px;">الزتونة في دقيقة</h2>
            <form id="briefForm">
                <input type="text" name="name" placeholder="اسمك الكريم" required>
                <input type="text" name="project" placeholder="نوع المشروع؟" required>
                <textarea name="notes" rows="5" placeholder="احكي لنا فكرتك باختصار.." required></textarea>
                <button type="submit" class="btn-cta" style="width:100%">إرسال للواتساب</button>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
