<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphicStudio — البريف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <div class="container">
      <div class="navInner">
        <a class="brand" href="index.html">
          <span class="brandMark">GS</span>
          <span class="brandText"><strong>GraphicStudio</strong><span>Brief</span></span>
        </a>
        <nav class="navLinks">
          <a href="index.html">الرئيسية</a>
          <a href="services.html">الخدمات</a>
          <a href="portfolio.html">الأعمال</a>
          <a href="brief.html" class="active cta">أرسل البريف</a>
        </nav>
        <div class="navActions">
          <button class="iconBtn" id="themeToggle">🌙</button>
          <button class="iconBtn" id="langToggle">AR</button>
          <a class="cta" id="waTop" href="#">واتساب</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="pageHero">
      <div class="heroCard">
        <h1>ابدأ مشروعك</h1>
        <p>املأ النموذج وسيتم تحويلك فوراً للواتساب بالرسالة جاهزة.</p>
      </div>
    </section>

    <form class="form" id="briefForm">
      <div class="row">
        <label>اسمك الكريم</label>
        <input name="name" required placeholder="الاسم" />
      </div>
      <div class="row">
        <label>الخدمة المطلوبة</label>
        <select name="service">
          <option>هوية بصرية</option>
          <option>إنفوجرافيك</option>
          <option>سوشيال ميديا</option>
          <option>غير ذلك</option>
        </select>
      </div>
      <div class="row">
        <label>تفاصيل المشروع</label>
        <textarea name="notes" rows="5" required placeholder="اشرح لنا فكرتك..."></textarea>
      </div>
      <button class="btn btnPrimary" type="submit" style="width:100%">إرسال للواتساب</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <div class="footerInner">
        <div>© <span id="year"></span> Alaa Omran</div>
      </div>
    </div>
  </footer>

  <a class="waFloat" id="waFloat" href="#">واتساب</a>
  <script src="js/main.js"></script>
</body>
</html>
