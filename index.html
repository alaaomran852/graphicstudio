<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Studio | التصميم من الآخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue-tech: #0062ff; /* الأزرق التقني */
            --bg-dark: #050a18;   /* خلفية فخمة */
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* نافبار مختصر */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 10, 24, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 900; font-size: 1.4rem; color: var(--blue-tech); }

        /* الهيرو - الزتونة */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            margin-bottom: 20px;
        }

        .hero h1 span { color: var(--blue-tech); }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-dim);
            max-width: 600px;
            margin-bottom: 40px;
        }

        .btn-cta {
            background: var(--blue-tech);
            color: white;
            padding: 18px 45px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 98, 255, 0.3);
        }

        .btn-cta:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0, 98, 255, 0.5); }

        /* سيكشن البريف */
        .brief-section {
            padding: 100px 8%;
            background: var(--card-bg);
            border-top: 1px solid #1e293b;
        }

        .section-head { text-align: center; margin-bottom: 50px; }
        .section-head h2 { font-size: 2.2rem; margin-bottom: 10px; }

        .form-grid {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: #050a18;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus, select:focus { border-color: var(--blue-tech); }

        .submit-btn {
            grid-column: span 2;
            background: var(--blue-tech);
            border: none;
            color: white;
            padding: 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        /* شغل الجرافيك - كروت سريعة */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 50px 0;
        }

        .work-card {
            background: #0f172a;
            height: 250px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1e293b;
            color: var(--text-dim);
            transition: 0.3s;
        }

        .work-card:hover { border-color: var(--blue-tech); color: white; }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .submit-btn { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">GS STUDIO</div>
        <div class="nav-links">
            <a href="#brief" style="color: var(--blue-tech); text-decoration: none; font-weight: bold;">ابدأ مشروعك</a>
        </div>
    </nav>

    <section class="hero">
        <h1>هوية بصرية <span>تبيع لك.</span></h1>
        <p>مش بنعمل مجرد رسومات، إحنا بنبني "شخصية" لبراندك تخلي العميل يختارك أنت وسط زحمة السوق.</p>
        <a href="#brief" class="btn-cta">ابعت البريف.. وإحنا نكلمك</a>
    </section>

    <section id="brief" class="brief-section">
        <div class="section-head">
            <h2>الزتونة في دقيقة</h2>
            <p>املأ البيانات دي وهتلاقينا بنكلمك نخلص الاتفاق.</p>
        </div>

        <form class="form-grid" id="whatsappForm">
            <input type="text" id="name" placeholder="اسمك إيه؟" required>
            <input type="text" id="projectType" placeholder="نوع المشروع (لوجو، هوية، سوشيال..)" required>
            <select id="budget" class="full-width">
                <option value="" disabled selected>ميزانيتك التقريبية في حدود كام؟</option>
                <option value="بسيطة">بداية (بسيطة)</option>
                <option value="متوسطة">احترافية (متوسطة)</option>
                <option value="كبيرة">شاملة (كبيرة)</option>
            </select>
            <textarea id="details" class="full-width" rows="4" placeholder="احكي لنا فكرتك باختصار.." required></textarea>
            <button type="submit" class="submit-btn">إرسال البريف للواتساب</button>
        </form>
    </section>

    <footer style="text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.9rem;">
        &copy; 2024 Graphic Studio | تم التصميم بكل احترافية
    </footer>

    <script>
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // تجميع البيانات
            const name = document.getElementById('name').value;
            const type = document.getElementById('projectType').value;
            const budget = document.getElementById('budget').value;
            const details = document.getElementById('details').value;

            // بناء رسالة الواتساب
            const message = `يا هلا.. أنا ${name}%0Aمحتاج شغل: ${type}%0Aالميزانية: ${budget}%0Aالتفاصيل: ${details}`;
            
            // رقم تليفونك هنا (استبدله برقمك)
            const phone = "201100000000"; 
            
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        });

        // انيميشن بسيط للسكرول
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
